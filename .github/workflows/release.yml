name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm run lint --workspace @ioi-dev/vue-table
      - run: npm run typecheck --workspace @ioi-dev/vue-table
      - run: npm run test --workspace @ioi-dev/vue-table
      - run: npm run build --workspace @ioi-dev/vue-table
      - run: npm run verify:artifact --workspace @ioi-dev/vue-table
      - run: npm run test:consumers --workspace @ioi-dev/vue-table

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./packages/vue-table/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match package version $PKG_VERSION"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --workspace @ioi-dev/vue-table --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
